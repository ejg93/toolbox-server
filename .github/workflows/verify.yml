name: verify

# push 만 — pull_request 를 같이 걸면 같은 커밋을 두 번 돌린다(ProjectShop 2c-3, 2026-09-26 이관).
# 가지 보호의 필수 검사는 이름으로 맞추고 이벤트를 안 가려서 push 실행이 PR 에도 붙는다.
# fork PR 은 push 가 안 돈다 — 바깥 PR 을 받기 시작하면 pull_request 를 되돌린다.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # migration-immutable 이 반입 기준점 커밋까지 거슬러 본다
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: java 레인 — mvn verify (컨테이너 포함)
        run: ./mvnw -B -q verify

      - name: 반입된 마이그레이션 불변
        run: bash scripts/migration-immutable.sh

      - name: tools 레인 — 셸 문법·settings.json·훅 회귀
        run: |
          git config --global user.name ci
          git config --global user.email ci@localhost
          for f in scripts/*.sh scripts/hooks/*.sh; do bash -n "$f"; done
          node -e 'JSON.parse(require("fs").readFileSync(".claude/settings.json","utf8"))'
          bash scripts/hooks-test.sh

      - name: docs 레인 — doc-lint
        run: bash scripts/doc-lint.sh CLAUDE.md PLAN.md PROGRESS.md README.md

  # 규칙 5 — m2/ 만으로 네트워크 없이 빌드되나(0-29). 0-12 의 annotations 13.0, 0-22 의 SpotBugs 실행 의존성이
  # 손으로 돌려서야 드러났다. 채우기가 수 분이라 pom.xml·.mvn 이 바뀐 push 와 손으로 부른 실행에서만 돈다.
  # 필수 검사가 아니다(첫 달 안정성을 본 뒤 정한다).
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: pom.xml·.mvn 이 바뀌었나
        id: pom
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # 새 가지의 첫 push 는 before 가 0 이다 — main 과 갈라진 자리부터 본다
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$(git merge-base origin/main HEAD 2>/dev/null || git rev-parse HEAD~1)
          else
            base=$BEFORE
          fi
          # 잡은 건너뛰어도 success 로 뜬다 — 돈 것처럼 보이니 기준 커밋과 판단을 찍는다(0-37)
          echo "기준 $(git rev-parse --short "$base") → HEAD $(git rev-parse --short HEAD)"
          if git diff --name-only "$base" HEAD | grep -qE '^(pom\.xml|\.mvn/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "pom.xml·.mvn 이 바뀌었다 — 오프라인 빌드를 돌린다"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "pom.xml·.mvn 이 안 바뀌었다 — 건너뛴다"
          fi

      - uses: actions/setup-java@v4
        if: steps.pom.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: m2/ 채우기 → 네트워크 없이(-o) 빌드
        if: steps.pom.outputs.run == 'true'
        run: bash scripts/offline-build.sh

  # 시크릿이 커밋에 들어갔나(ProjectShop `ci.yml` secrets 잡 이관, 0-18).
  # 두 번째 그물이다 — 첫째는 저장소 설정의 push protection(아는 제공자 토큰 모양만). gitleaks 는 더 넓게 보지만
  # 푸시된 뒤에야 답한다. 가지 보호 필수 검사.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # 이력 전체 — 얕게 받으면 예전 커밋에 박힌 것을 못 찾는다
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
