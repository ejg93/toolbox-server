# 외부 분석기(묶음 ㅅ — SpotBugs·FindSecBugs) 지적 유형별 권장 수정(5-43, 설계 36, 사용자 확인 2026-10-24).
# 고치는 법이 하나로 정해진 유형(「상」 — SpotBugs·FindSecBugs 공식 설명과 KISA 구현단계 가이드가 같은 수정을 권함)만 적는다.
# 방향은 같지만 꼴이 문맥마다 갈리는 「중」, 의도된 설계·오탐이 흔한 「하」, 표본에 아직 안 나온 유형은 일부러 비운다.
