# 코드 검사 내장 규칙(PLAN 3.1·3.5·5-1). 규칙 하나 = id·group·severity·globs + kind 별 값.
# kind: regex(기본 — regex·flags·skipComments, params.max 면 건수 규칙) · file(params.check) · jsUnusedImport
# 프로필 codecheck.customRules 가 같은 꼴로 더하고(같은 id 면 바꿈), codecheck.rules 가 id 별로 덮어쓴다.
# ㄱ(common)은 JSP·HTML·Java·설정 파일, ㅁ(tsx)은 JS·TS 파일 — 같은 잔재를 두 번 세지 않게 글롭을 나눈다.
# ㅇ(security)은 다른 묶음과 겹쳐도 따로 센다(보안약점 보고용 묶음).
# fix(권장 수정 한 줄 — 결과 표·xlsx 「권장 수정」)·ref(근거 — 개발보안 가이드 항목 번호, 사람이 채운다)는 판정에 안 끼친다(5-25).
rules:
  # ---------------------------------------------------------------- ㄱ 공통 잔재
  - id: common.debugger
    group: common
    severity: warn
    globs: ['*.jsp', '*.jspf', '*.html', '*.htm']
    regex: '\bdebugger\b'
    skipComments: true
    message: debugger 문 잔재
    fix: '배포 전에 debugger 줄을 지운다'
  - id: common.consoleLog
    group: common
    severity: warn
    globs: ['*.jsp', '*.jspf', '*.html', '*.htm']
    regex: '\bconsole\.log\s*\('
    skipComments: true
    message: console.log 잔재
    fix: '줄을 지운다 — 남길 정보는 서버 쪽 로거로 옮긴다'
  - id: common.alert
    group: common
    severity: info
    globs: ['*.jsp', '*.jspf', '*.html', '*.htm', '*.js', '*.jsx', '*.ts', '*.tsx']
    regex: '(?<![\w$.])alert\s*\('
    skipComments: true
    message: alert( 호출 — 디버그 잔재인지 확인
    fix: '디버그용이면 지우고, 사용자 안내면 화면 공통 메시지 함수로 바꾼다'
  - id: common.sysout
    group: common
    severity: warn
    globs: ['*.java', '*.jsp', '*.jspf']
    regex: '\bSystem\s*\.\s*(?:out|err)\s*\.\s*print'
    skipComments: true
    message: System.out/err 출력 — 로거로
    fix: 'SLF4J·Log4j 로거의 debug·info 호출로 바꾼다'
  - id: common.printStackTrace
    group: common
    severity: warn
    globs: ['*.java', '*.jsp', '*.jspf']
    regex: '\.printStackTrace\s*\(\s*\)'
    skipComments: true
    message: printStackTrace — 로거로
    fix: '로거의 error(메시지, 예외) 호출로 바꾼다 — 스택은 로그 파일에만'
  - id: common.todo
    group: common
    severity: info
    globs: ['*.java', '*.jsp', '*.jspf', '*.js', '*.jsx', '*.ts', '*.tsx', '*.xml', '*.sql', '*.properties']
    regex: '\b(?:TODO|FIXME|XXX)\b'
    skipComments: false
    message: TODO·FIXME 남음
    fix: '처리하고 지우거나, 남은 일이면 이슈로 옮기고 주석을 지운다'
  - id: common.localhost
    group: common
    severity: warn
    globs: ['*.java', '*.jsp', '*.jspf', '*.js', '*.jsx', '*.ts', '*.tsx', '*.xml', '*.properties', '*.yml', '*.yaml', '*.html']
    regex: '\blocalhost\b|(?<![\d.])127\.0\.0\.1(?![\d.])'
    skipComments: true
    message: localhost 주소 하드코딩
    fix: '주소를 환경별 프로퍼티로 빼고 코드는 키로 읽는다'
  - id: common.devIp
    group: common
    severity: warn
    globs: ['*.java', '*.jsp', '*.jspf', '*.js', '*.jsx', '*.ts', '*.tsx', '*.xml', '*.properties', '*.yml', '*.yaml', '*.html']
    regex: '(?<![\d.])(?:10(?:\.\d{1,3}){3}|192\.168(?:\.\d{1,3}){2}|172\.(?:1[6-9]|2\d|3[01])(?:\.\d{1,3}){2})(?![\d.])'
    skipComments: true
    message: 사설(개발) IP 하드코딩
    fix: '서버 주소를 환경별 프로퍼티로 빼고 코드는 키로 읽는다'
  - id: common.password
    group: common
    severity: error
    globs: ['*.properties', '*.xml', '*.yml', '*.yaml', '*.jsp', '*.js']
    regex: '\b(?:password|passwd|pwd)\b["'']?\s*(?:[=:]|value\s*=)\s*["'']?[^\s"''$#{<>]'
    flags: [i]
    skipComments: true
    message: 비밀번호 값 하드코딩 — 외부 설정·암호화로
    fix: '값을 지우고 환경 변수나 암호화 프로퍼티(Jasypt 등)에서 읽는다'

  # ---------------------------------------------------------------- ㄹ JSP
  - id: jsp.expression
    group: jsp
    severity: info
    globs: ['*.jsp', '*.jspf', '*.tag']
    regex: '<%='
    skipComments: true
    message: <%= %> 출력 — 이스케이프 없이 나간다(c:out·fn:escapeXml)
    fix: 'c:out 이나 fn:escapeXml 로 감싼 EL 로 바꾼다(맨 EL 은 이스케이프 안 함)'
  - id: jsp.escapeXmlFalse
    group: jsp
    severity: warn
    globs: ['*.jsp', '*.jspf', '*.tag']
    regex: 'escapeXml\s*=\s*["'']false["'']'
    flags: [i]
    skipComments: true
    message: escapeXml="false" — 이스케이프를 끈다
    fix: '속성을 지운다(기본 true) — HTML 이 꼭 필요하면 허용 태그만 거른 값으로'
  - id: jsp.scriptlets
    group: jsp
    severity: info
    globs: ['*.jsp', '*.jspf', '*.tag']
    regex: '<%(?![@=!-])'
    skipComments: true
    message: 스크립틀릿 블록 수가 기준을 넘는다
    fix: '로직은 컨트롤러·서비스로, 화면 분기는 JSTL c:if·c:forEach 로 옮긴다'
    params: {max: 0}

  # ---------------------------------------------------------------- ㅁ TSX·JS
  - id: tsx.debugger
    group: tsx
    severity: warn
    globs: ['*.js', '*.jsx', '*.ts', '*.tsx', '*.mjs']
    regex: '\bdebugger\b'
    skipComments: true
    message: debugger 문 잔재
    fix: '배포 전에 debugger 줄을 지운다'
  - id: tsx.console
    group: tsx
    severity: warn
    globs: ['*.js', '*.jsx', '*.ts', '*.tsx', '*.mjs']
    regex: '\bconsole\.(?:log|debug|info|warn|error|trace|dir|table)\s*\('
    skipComments: true
    message: console 호출 잔재
    fix: '줄을 지우거나 공통 로거로 모아 배포 빌드에서 걸러지게 한다'
  - id: tsx.unusedImport
    group: tsx
    severity: warn
    kind: jsUnusedImport
    globs: ['*.js', '*.jsx', '*.ts', '*.tsx', '*.mjs']
    message: 쓰지 않는 import
    fix: 'import 에서 안 쓰는 이름을 지운다(줄이 비면 줄째)'
  - id: tsx.any
    group: tsx
    severity: info
    globs: ['*.ts', '*.tsx']
    regex: ':\s*any\b|\bas\s+any\b|<any>'
    skipComments: true
    message: any 타입
    fix: '실제 꼴의 interface·type 을 적고, 모르면 unknown 으로 받아 좁힌다'
  - id: tsx.eslintDisable
    group: tsx
    severity: info
    globs: ['*.js', '*.jsx', '*.ts', '*.tsx', '*.mjs']
    regex: 'eslint-disable'
    skipComments: false
    message: eslint-disable 주석
    fix: '짚은 코드를 고치고 주석을 지운다 — 남기면 규칙 이름과 사유를 단다'

  # ---------------------------------------------------------------- ㅂ 파일
  - id: file.encoding
    group: file
    severity: warn
    kind: file
    globs: ['*.java', '*.jsp', '*.jspf', '*.tag', '*.js', '*.jsx', '*.ts', '*.tsx', '*.xml', '*.properties', '*.html', '*.css', '*.sql']
    message: 인코딩이 프로필 project.encoding 과 다르다
    fix: '편집기·iconv 로 project.encoding 에 맞게 다시 저장한다'
    params: {check: encoding}
  - id: file.lineEnding
    group: file
    severity: info
    kind: file
    globs: ['*.java', '*.jsp', '*.jspf', '*.tag', '*.js', '*.jsx', '*.ts', '*.tsx', '*.xml', '*.properties', '*.html', '*.css', '*.sql']
    message: 줄바꿈이 프로필 project.lineEnding 과 다르다
    fix: '편집기·.gitattributes 로 project.lineEnding 에 맞춘다'
    params: {check: lineEnding}
  - id: file.mixedIndent
    group: file
    severity: info
    kind: file
    globs: ['*.java', '*.jsp', '*.jspf', '*.tag', '*.js', '*.jsx', '*.ts', '*.tsx', '*.xml', '*.html', '*.css', '*.sql']
    message: 탭 들여쓰기와 공백 들여쓰기가 한 파일에 섞였다
    fix: '편집기의 들여쓰기 변환으로 프로젝트 관례 한 가지에 맞춘다'
    params: {check: mixedIndent}
  - id: file.header
    group: file
    severity: info
    kind: file
    globs: ['*.java']
    message: 파일 헤더 개정이력(수정일 수정자 수정내용) 누락 — 프로필 naming.headerRequired
    fix: '파일 첫 주석에 수정일·수정자·수정내용 개정이력 표를 넣는다'
    params: {check: header}

  # ---------------------------------------------------------------- ㅇ 보안약점(정적분)
  - id: security.sqlDollar
    group: security
    severity: error
    globs: ['*.xml']
    regex: '\$\{'
    skipComments: true
    message: SQL 삽입 — MyBatis ${} 치환(#{} 로)
    fix: '값은 #{} 바인드로, 정렬·컬럼 이름은 허용 목록에서 고른 값만 치환'
  - id: security.sqlConcat
    group: security
    severity: error
    globs: ['*.java', '*.jsp']
    regex: '"[^"]*\b(?:SELECT|INSERT|UPDATE|DELETE|MERGE)\b[^"]*"\s*\+\s*[\w(]'
    flags: [i]
    skipComments: true
    message: SQL 삽입 — 문자열 조립 쿼리(바인드 변수로)
    fix: '문자열 조립 대신 PreparedStatement·MyBatis #{} 바인드로'
  - id: security.xssExpression
    group: security
    severity: warn
    globs: ['*.jsp', '*.jspf', '*.tag']
    regex: '<%=\s*request\s*\.\s*getParameter|<%=(?![^%]*(?:escape|encode))'
    skipComments: true
    message: XSS — 이스케이프 없는 <%= 출력
    fix: '출력은 JSTL c:out 이나 fn:escapeXml 로 이스케이프해서'
  - id: security.xssEscapeXml
    group: security
    severity: warn
    globs: ['*.jsp', '*.jspf', '*.tag']
    regex: 'escapeXml\s*=\s*["'']false["'']'
    flags: [i]
    skipComments: true
    message: XSS — escapeXml="false"
    fix: 'escapeXml 을 지우거나 true 로 — HTML 이 꼭 필요하면 허용 태그만 거른다'
  - id: security.pathTraversal
    group: security
    severity: error
    globs: ['*.java', '*.jsp']
    regex: 'new\s+(?:java\.io\.)?File(?:InputStream|OutputStream|Reader|Writer)?\s*\([^;]*getParameter\s*\('
    skipComments: true
    message: 경로 조작 — 요청 파라미터로 파일 경로를 만든다
    fix: '파일은 서버가 정한 ID 로 찾고, 경로 구분자·상위 경로 글자를 거부한다'
  - id: security.hardcodedPassword
    group: security
    severity: error
    globs: ['*.java']
    regex: '\b\w*(?:password|passwd|pwd)\w*\s*=\s*"[^"]+"'
    flags: [i]
    skipComments: true
    message: 하드코딩 비밀번호
    fix: '비밀번호를 소스에서 빼서 암호화한 설정 파일·환경 변수로'
  - id: security.exceptionMessage
    group: security
    severity: warn
    globs: ['*.java', '*.jsp']
    regex: '(?:\baddAttribute|\baddObject|\bgetWriter\s*\(\s*\)|\bout\s*\.\s*print(?:ln)?|\bResponseEntity|\.body)\s*[.(<].*\.getMessage\s*\(\s*\)'
    skipComments: true
    message: 예외 메시지 노출 — getMessage() 를 응답에 싣는다
    fix: '응답엔 고정 안내 글만 싣고 예외 내용은 서버 로그로'

  # ---------------------------------------------------------------- ㅇ 2차 — KISA 구현단계 정적분(5-13, 2026-10-03)
  # 기준은 CWE Top 25 가 아니라 행안부·KISA 「소프트웨어 개발보안 가이드」 구현단계 항목(감리가 인용하는 번호).
  # 등급: 쓰는 순간 지적이면 error, 입력이 닿는지 봐야 하면 warn, 확인용이면 info
  - id: security.osCommand
    group: security
    severity: error
    globs: ['*.java', '*.jsp']
    regex: 'Runtime\s*\.\s*getRuntime\s*\(\s*\)\s*\.\s*exec\s*\(|new\s+ProcessBuilder\s*\('
    skipComments: true
    message: 운영체제 명령어 삽입 — 외부 입력이 닿는지 확인
    fix: '외부 입력을 명령에 넣지 않는다 — 허용 목록 값으로 치환'
  - id: security.deserialization
    group: security
    severity: error
    globs: ['*.java']
    regex: 'new\s+ObjectInputStream\s*\(|new\s+XMLDecoder\s*\(|\.(?:enableDefaultTyping|activateDefaultTyping)\s*\('
    skipComments: true
    message: 신뢰할 수 없는 데이터의 역직렬화
    fix: '외부 데이터는 JSON 같은 데이터 형식으로, 역직렬화엔 허용 클래스 필터를'
  - id: security.codeInjection
    group: security
    severity: warn
    globs: ['*.java']
    regex: 'ScriptEngineManager|\.eval\s*\(|parseExpression\s*\('
    skipComments: true
    message: 코드 삽입 — 외부 입력이 닿는지 확인
    fix: '외부 입력을 스크립트·식 평가에 넣지 않는다 — 허용 목록 값으로 치환'
  - id: security.ssrf
    group: security
    severity: warn
    globs: ['*.java']
    regex: 'new\s+URL\s*\([^;]*getParameter|(?:RestTemplate|HttpClient|HttpURLConnection|openConnection)[^;]*getParameter'
    skipComments: true
    message: 서버사이드 요청 위조 — 요청 파라미터로 URL 을 만든다
    fix: '요청 대상은 허용 도메인 목록에서 고르고 내부망 주소를 막는다'
  - id: security.openRedirect
    group: security
    severity: warn
    globs: ['*.java']
    regex: 'sendRedirect\s*\([^;]*getParameter|"redirect:"\s*\+'
    skipComments: true
    message: 신뢰되지 않는 URL 주소로 자동접속 연결 — 이동 주소를 허용목록으로
    fix: '이동할 곳은 상대 경로나 목록 키로 받아 서버가 주소를 만든다'
  - id: security.responseSplitting
    group: security
    severity: warn
    globs: ['*.java']
    regex: '(?:setHeader|addHeader|addCookie|new\s+Cookie)\s*\([^;]*getParameter'
    skipComments: true
    message: HTTP 응답분할 — 요청 파라미터를 헤더·쿠키에 넣는다
    fix: '헤더·쿠키에 넣을 값에서 줄바꿈 문자(CR·LF)를 지우거나 거부한다'
  - id: security.weakHash
    group: security
    severity: error
    globs: ['*.java', '*.jsp']
    regex: 'MessageDigest\s*\.\s*getInstance\s*\(\s*"(?:MD2|MD4|MD5|SHA-?1)"'
    flags: [i]
    skipComments: true
    message: 취약한 암호화 알고리즘 사용 — 해시는 SHA-256 이상
    fix: 'MD5·SHA-1 대신 SHA-256 이상, 비밀번호는 솔트 붙인 반복 해시(PBKDF2 등)로'
  - id: security.weakCipher
    group: security
    severity: error
    globs: ['*.java', '*.jsp']
    regex: 'Cipher\s*\.\s*getInstance\s*\(\s*"(?:DES|DESede|RC2|RC4|ARCFOUR|Blowfish)\b|Cipher\s*\.\s*getInstance\s*\(\s*"[^"]*/ECB/|Cipher\s*\.\s*getInstance\s*\(\s*"(?:AES|DESede|Blowfish)"'
    flags: [i]
    skipComments: true
    message: 취약한 암호화 알고리즘 사용 — 암호는 AES/GCM·CBC(모드를 안 쓰면 ECB 다)
    fix: 'DES·RC4·ECB 대신 AES-GCM(또는 AES-CBC + 매번 새 IV)으로'
  - id: security.weakRandom
    group: security
    severity: info
    globs: ['*.java', '*.jsp']
    regex: 'new\s+(?:java\.util\.)?Random\s*\(|Math\s*\.\s*random\s*\('
    skipComments: true
    message: 적절하지 않은 난수 값 사용 — 보안 용도면 SecureRandom
    fix: '토큰·임시 비밀번호·키 같은 보안 값은 SecureRandom 으로 만든다'
  - id: security.hardcodedKey
    group: security
    severity: error
    globs: ['*.java']
    regex: '(?:SecretKeySpec|IvParameterSpec|PBEKeySpec)\s*\(\s*"'
    skipComments: true
    message: 하드코드된 암호화 키
    fix: '키를 소스에서 빼서 키 저장소나 암호화한 설정 파일로'
  - id: security.jsEval
    group: security
    severity: warn
    globs: ['*.jsp', '*.jspf', '*.html', '*.htm', '*.js', '*.jsx', '*.ts', '*.tsx', '*.mjs']
    regex: '(?<![\w$.])eval\s*\(|new\s+Function\s*\(|set(?:Timeout|Interval)\s*\(\s*["'']'
    skipComments: true
    message: 코드 삽입 — eval·Function·문자열 타이머
    fix: 'eval·Function 대신 JSON.parse·함수 참조로, 타이머엔 함수를 넘긴다'
  - id: security.domXss
    group: security
    severity: info
    globs: ['*.jsp', '*.jspf', '*.html', '*.htm', '*.js', '*.jsx', '*.ts', '*.tsx', '*.mjs']
    regex: '\.(?:innerHTML|outerHTML)\s*\+?=(?!=)(?!\s*["'']{2}\s*;)|document\s*\.\s*write(?:ln)?\s*\(|insertAdjacentHTML\s*\('
    skipComments: true
    message: 크로스사이트 스크립트(DOM) — 입력이 들어가면 textContent·이스케이프
    fix: 'innerHTML·document.write 대신 textContent·createElement 로 넣는다'
  - id: security.jsxDangerousHtml
    group: security
    severity: warn
    globs: ['*.jsx', '*.tsx']
    regex: 'dangerouslySetInnerHTML'
    skipComments: true
    message: 크로스사이트 스크립트 — dangerouslySetInnerHTML
    fix: 'JSX 글자로 출력하고, HTML 이 꼭 필요하면 정화를 거친 값만'
  - id: security.jspElParam
    group: security
    severity: warn
    globs: ['*.jsp', '*.jspf', '*.tag']
    regex: '(?<![="''(])\$\{param\.'
    skipComments: true
    message: 크로스사이트 스크립트 — 요청 파라미터 EL 직접 출력(<c:out> 으로)
    fix: '요청 파라미터는 c:out 이나 fn:escapeXml 로 이스케이프해서 출력'
  - id: security.fileUpload
    group: security
    severity: info
    globs: ['*.java']
    regex: 'getOriginalFilename\s*\('
    skipComments: true
    message: 위험한 형식 파일 업로드 — 확장자 허용목록·크기·저장 경로 확인
    fix: '확장자 허용 목록·크기 상한을 서버에서 검사하고 웹 루트 밖에 새 이름으로 저장'

  # ---------------------------------------------------------------- ㅇ 3차 — 개인정보 꼴·설정 파일(5-18, 2026-10-03)
  # 설정 규칙 중 「없음」 넷은 kind: absent(web.xml 에 error-page·세션 만료·쿠키 HttpOnly·Secure 가 한 줄도 없음)
  - id: security.piiRrn
    group: security
    severity: error
    globs: ['*.java', '*.jsp', '*.jspf', '*.js', '*.jsx', '*.ts', '*.tsx', '*.xml', '*.properties', '*.sql', '*.html']
    regex: '(?<![\d-])\d{6}-[1-4]\d{6}(?!\d)'
    skipComments: true
    message: 개인정보 — 주민등록번호 꼴 값
    fix: '실제 번호면 지우고 시험 값은 가짜 번호로, 저장할 땐 암호화'
  - id: security.piiCard
    group: security
    severity: warn
    globs: ['*.java', '*.jsp', '*.jspf', '*.js', '*.jsx', '*.ts', '*.tsx', '*.xml', '*.properties', '*.sql', '*.html']
    regex: '(?<![\d-])\d{4}-\d{4}-\d{4}-\d{4}(?![\d-])'
    skipComments: true
    message: 개인정보 — 카드번호 꼴 값
    fix: '실제 번호면 지우고 시험 값은 가짜 번호로, 화면엔 가운데를 가린다'
  - id: security.piiPhone
    group: security
    severity: info
    globs: ['*.java', '*.jsp', '*.jspf', '*.js', '*.jsx', '*.ts', '*.tsx', '*.xml', '*.properties', '*.sql', '*.html']
    regex: '(?<![\d-])01[016789]-\d{3,4}-\d{4}(?!\d)'
    skipComments: true
    message: 개인정보 — 휴대폰 번호 꼴 값
    fix: '실제 번호면 지우고 시험 값은 가짜 번호로, 화면·로그엔 가운데를 가린다'
  - id: security.piiLog
    group: security
    severity: warn
    globs: ['*.java']
    regex: '\b(?:log|logger)\s*\.\s*(?:trace|debug|info|warn|error)\s*\((?:"[^"]*"|[^;"])*?\b\w*(?:ihidnum|jumin|passw(?:or)?d|cardno|accountno|mbtlnum|moblphon)\w*\s*[,)+.(]'
    flags: [i]
    skipComments: true
    message: 개인정보 — 로그에 개인정보·비밀번호 변수(문자열 안 낱말은 안 본다)
    fix: '로그엔 개인정보·비밀번호 대신 식별자나 가린 값을 남긴다'
  - id: security.cfgDebugLog
    group: security
    severity: info
    globs: ['*.xml']
    regex: '<(?:Logger|Root|AsyncLogger)\b[^>]*\blevel\s*=\s*["''](?:DEBUG|TRACE|ALL)["'']'
    flags: [i]
    skipComments: true
    message: 설정 — 로그 수준 DEBUG(운영 반영 전 확인)
    fix: '운영 설정은 INFO 이상으로, DEBUG 는 개발 프로필에만'
  - id: security.cfgDebugLogProps
    group: security
    severity: info
    globs: ['*.properties', '*.yml', '*.yaml']
    regex: '^\s*(?:log4j\.(?:rootLogger|logger\.[\w.]+)|logging\.level\.[\w.]+)\s*[=:]\s*(?:DEBUG|TRACE|ALL)\b'
    flags: [i]
    skipComments: true
    message: 설정 — 로그 수준 DEBUG(운영 반영 전 확인)
    fix: '운영 설정은 INFO 이상으로, DEBUG 는 개발 프로필에만'
  - id: security.cfgStackTrace
    group: security
    severity: warn
    globs: ['*.properties', '*.yml', '*.yaml']
    regex: 'server\.error\.include-(?:stacktrace|message|exception)\s*[=:]\s*(?:always|true|on_param)'
    flags: [i]
    skipComments: true
    message: 오류 메시지를 통한 정보노출 — 응답에 스택트레이스
    fix: '응답엔 오류 번호·안내 글만 싣고 스택트레이스는 서버 로그로'
  - id: security.cfgErrorPage
    group: security
    severity: warn
    kind: absent
    globs: ['*.xml']
    regex: '<error-page\b'
    skipComments: true
    message: 오류 메시지를 통한 정보노출 — web.xml 에 error-page 가 없다
    fix: 'web.xml 에 error-page(404·500·Throwable)를 두어 기본 오류 화면을 막는다'
    params: {when: '<web-app\b'}
  - id: security.cfgSessionTimeout
    group: security
    severity: info
    kind: absent
    globs: ['*.xml']
    regex: '<session-timeout\b'
    skipComments: true
    message: 세션 관리 — web.xml 에 session-timeout 이 없다
    fix: 'web.xml 의 session-config 에 session-timeout(예: 30분)을 둔다'
    params: {when: '<web-app\b'}
  - id: security.cfgCookieHttpOnly
    group: security
    severity: warn
    kind: absent
    globs: ['*.xml']
    regex: '<http-only>\s*true'
    skipComments: true
    message: 세션 관리 — 세션 쿠키 HttpOnly 가 없다
    fix: 'session-config 의 cookie-config 에 http-only 를 true 로'
    params: {when: '<web-app\b'}
  - id: security.cfgCookieSecure
    group: security
    severity: info
    kind: absent
    globs: ['*.xml']
    regex: '<secure>\s*true'
    skipComments: true
    message: 세션 관리 — 세션 쿠키 Secure 가 없다(HTTPS 운영이면)
    fix: 'HTTPS 로 운영하면 cookie-config 의 secure 를 true 로'
    params: {when: '<web-app\b'}

  # ---------------------------------------------------------------- ㅈ 웹 접근성·웹 표준(5-17, 2026-10-03)
  # 공공 웹은 웹 접근성(KWCAG)·웹 표준이 의무 — 정적으로 잡히는 꼴만. kind: absent 는 「파일에 when 이 있는데 regex 가 한 줄도 없음」
  # <form:input> 류는 안 본다(스프링이 id 를 만들어 label 과 잇는다)
  - id: a11y.imgAlt
    group: a11y
    severity: warn
    globs: ['*.jsp', '*.jspf', '*.tag', '*.html', '*.htm']
    regex: '<img\b(?!.*\balt\s*=)'
    skipComments: true
    message: 적절한 대체 텍스트 — img 에 alt 가 없다(장식이면 alt="")
    fix: '그림이 전하는 내용을 alt 에 글로 적는다(파일 이름·「이미지」 금지)'
  - id: a11y.inputLabel
    group: a11y
    severity: info
    globs: ['*.jsp', '*.jspf', '*.tag', '*.html', '*.htm']
    regex: '<input\b(?!.*\btype\s*=\s*["''](?:hidden|button|submit|image|reset)["''])(?!.*\b(?:title|aria-label|aria-labelledby|id)\s*=)'
    skipComments: true
    message: 레이블 제공 — 입력에 title·label 연결이 없다
    fix: 'label for 로 id 를 잇거나, 보이는 레이블이 없으면 title 을 단다'
  - id: a11y.selectLabel
    group: a11y
    severity: info
    globs: ['*.jsp', '*.jspf', '*.tag', '*.html', '*.htm']
    regex: '<(?:select|textarea)\b(?!.*\b(?:title|aria-label|aria-labelledby|id)\s*=)'
    skipComments: true
    message: 레이블 제공 — 선택·여러 줄 입력에 title·label 연결이 없다
    fix: 'label for 로 id 를 잇거나, 보이는 레이블이 없으면 title 을 단다'
  - id: a11y.iframeTitle
    group: a11y
    severity: warn
    globs: ['*.jsp', '*.jspf', '*.tag', '*.html', '*.htm']
    regex: '<iframe\b(?!.*\btitle\s*=)'
    skipComments: true
    message: 프레임 제목 제공 — iframe 에 title 이 없다
    fix: '프레임에 담긴 내용을 설명하는 title 을 단다'
  - id: a11y.htmlLang
    group: a11y
    severity: warn
    globs: ['*.jsp', '*.jspf', '*.tag', '*.html', '*.htm']
    regex: '<html\b(?!.*\blang\s*=)'
    skipComments: true
    message: 기본 언어 표시 — html 에 lang 이 없다
    fix: 'html 태그에 lang="ko" 를 단다'
  - id: a11y.deprecatedTag
    group: a11y
    severity: info
    globs: ['*.jsp', '*.jspf', '*.tag', '*.html', '*.htm']
    regex: '<(?:font|center|marquee|blink|big|strike|tt)\b'
    flags: [i]
    skipComments: true
    message: 웹 표준 — 폐기된 태그(CSS 로)
    fix: 'span·div 와 CSS 클래스로 바꾼다'
  - id: a11y.mouseOnly
    group: a11y
    severity: info
    globs: ['*.jsp', '*.jspf', '*.tag', '*.html', '*.htm']
    regex: '<(?:div|span|td|tr|li|img)\b(?=[^>]*\bonclick\s*=)(?![^>]*\b(?:onkey\w+|tabindex|role)\s*=)'
    skipComments: true
    message: 키보드 사용 보장 — 클릭만 받는 요소(키 이벤트·tabindex 없음)
    fix: 'button·a 로 바꾸거나 tabindex="0" 과 Enter 키 처리를 더한다'
  - id: a11y.nonStandardDom
    group: a11y
    severity: warn
    globs: ['*.jsp', '*.jspf', '*.tag', '*.html', '*.htm', '*.js']
    regex: '\bdocument\.(?:all|layers)\b'
    skipComments: true
    message: 웹 표준 — 비표준 DOM(getElementById 로)
    fix: 'document.all·layers 참조를 getElementById·querySelector 로 바꾼다'
  - id: a11y.activeX
    group: a11y
    severity: warn
    globs: ['*.jsp', '*.jspf', '*.tag', '*.html', '*.htm', '*.js']
    regex: '\bActiveXObject\b|\bclassid\s*=\s*["'']clsid:'
    flags: [i]
    skipComments: true
    message: 웹 표준 — ActiveX(플러그인 없이)
    fix: 'HTML5·JS 표준 API 로 대체한다(파일은 input file, 인쇄는 window.print)'
  - id: a11y.thScope
    group: a11y
    severity: info
    kind: absent
    globs: ['*.jsp', '*.jspf', '*.tag', '*.html', '*.htm']
    regex: '\b(?:scope|headers)\s*='
    skipComments: true
    message: 표의 구성 — 제목 셀(th)에 scope 가 한 번도 없다
    fix: '열 제목 th 에 scope="col", 행 제목 th 에 scope="row" 를 단다'
    params: {when: '<th\b'}
  - id: a11y.tableCaption
    group: a11y
    severity: warn
    kind: absent
    globs: ['*.jsp', '*.jspf', '*.tag', '*.html', '*.htm']
    regex: '<caption\b|\bsummary\s*='
    skipComments: true
    message: 표의 구성 — 제목 셀이 있는 표에 caption 이 한 번도 없다
    fix: '표 첫머리에 표 내용을 요약한 caption 을 넣는다'
    params: {when: '<th\b'}
  - id: a11y.pageTitle
    group: a11y
    severity: warn
    kind: absent
    globs: ['*.jsp', '*.jspf', '*.tag', '*.html', '*.htm']
    regex: '<title\b'
    skipComments: true
    message: 제목 제공 — 페이지에 title 이 없다
    fix: 'head 에 화면마다 다른 title 을 넣는다(「화면명 | 시스템명」)'
    params: {when: '<html\b'}

  # ---------------------------------------------------------------- ㄴ Java 구조(JavaParser, 5-2)
  # kind: java — 파일 하나를 한 번 파싱해 같이 돈다. 명명 정규식은 프로필 naming. egovOnly 는 framework egov* 일 때만
  - id: java.unusedImport
    group: java
    severity: warn
    kind: java
    globs: ['*.java']
    message: 쓰지 않는 import
    fix: 'import 줄을 지운다 — IDE 의 import 정리로'
  - id: java.starImport
    group: java
    severity: info
    kind: java
    globs: ['*.java']
    message: '* import'
    fix: '쓰는 클래스만 하나씩 import 한다 — IDE 의 import 정리로'
  - id: java.naming
    group: java
    severity: warn
    kind: java
    globs: ['*.java']
    message: '@Controller·@Service·@Repository 클래스 이름이 프로필 naming 정규식과 다르다'
    fix: '프로필 naming 정규식에 맞게 클래스 이름을 바꾼다(XxxController 등)'
  - id: java.serviceImplPair
    group: java
    severity: warn
    kind: java
    globs: ['*.java']
    message: XxxServiceImpl 이 XxxService 를 implements 하지 않는다
    fix: 'implements 에 짝 인터페이스를 더하거나 두 이름을 짝에 맞춘다'
  - id: java.serviceName
    group: java
    severity: warn
    kind: java
    globs: ['*.java']
    message: '@Service("이름") 이 클래스·인터페이스 이름(첫 글자 소문자)과 다르다'
    fix: '@Service 값을 구현 인터페이스(없으면 클래스) 이름의 첫 글자 소문자로'
    params: {egovOnly: true}
  - id: java.egovBase
    group: java
    severity: warn
    kind: java
    globs: ['*.java']
    message: ServiceImpl 이 naming.serviceImplBase(EgovAbstractServiceImpl)를 상속하지 않는다
    fix: '클래스 선언에 extends 를 더한다 — 부모가 따로 있으면 프로필 값을 고친다'
    params: {egovOnly: true}
  - id: java.emptyCatch
    group: java
    severity: warn
    kind: java
    globs: ['*.java']
    message: 빈 catch(주석만 있는 것 포함)
    fix: '로거로 남기거나 업무 예외로 감싸 다시 던진다'
  - id: java.swallow
    group: java
    severity: warn
    kind: java
    globs: ['*.java']
    message: ServiceImpl 안 catch 가 예외를 삼킨다(throw·로거·processException 없음)
    fix: 'processException 으로 업무 예외를 던지거나 로그를 남기고 다시 던진다'
  - id: java.controllerDao
    group: java
    severity: warn
    kind: java
    globs: ['*.java']
    message: Controller 가 DAO 를 직접 든다
    fix: 'Controller 는 Service 를 들고, DAO 호출은 ServiceImpl 로 옮긴다'
  - id: java.dupMapping
    group: java
    severity: error
    kind: java
    globs: ['*.java']
    message: 같은 HTTP 방식·URL 매핑이 둘 이상(프로젝트 전체)
    fix: '한쪽 URL·HTTP 방식을 바꾸거나 두 메서드를 하나로 합친다'
  - id: java.parseError
    group: java
    severity: info
    kind: java
    globs: ['*.java']
    message: Java 구문을 못 읽어 구조 규칙을 건너뛰었다

  # ---------------------------------------------------------------- ㄷ MyBatis XML(JDK SAX, 5-3)
  # kind: mybatis — <mapper> XML 의 문장 요소 글에서 SQL 주석을 뗀 뒤. namespace 는 같은 검사에서 본 Java 소스와 견준다
  - id: mybatis.dollar
    group: mybatis
    severity: warn
    kind: mybatis
    globs: ['*.xml']
    message: '${} 치환 — #{} 바인드로(정렬 컬럼 등 불가피하면 화이트리스트)'
    fix: '바인드로 못 바꾸는 자리는 Java 에서 허용 목록의 값만 골라 넘긴다'
  - id: mybatis.selectStar
    group: mybatis
    severity: info
    kind: mybatis
    globs: ['*.xml']
    message: 'SELECT * — 컬럼을 적는다(페이징 래퍼 SELECT * FROM ( 는 뺌)'
    fix: '쓰는 컬럼만 SELECT 절에 적는다 — resultMap·VO 필드와 맞춰'
  - id: mybatis.noWhere
    group: mybatis
    severity: warn
    kind: mybatis
    globs: ['*.xml']
    message: WHERE 없는 UPDATE·DELETE — 전체 행 대상인지 확인
    fix: 'PK 등 대상 조건을 WHERE 에 넣는다 — 전체 대상이 의도면 그대로 둔다'
  - id: mybatis.dupId
    group: mybatis
    severity: error
    kind: mybatis
    globs: ['*.xml']
    message: 같은 파일 안 문장 id 중복
    fix: '한쪽 id 를 바꾸고 그 id 를 부르는 DAO·Mapper 메서드도 같이 바꾼다'
  - id: mybatis.namespace
    group: mybatis
    severity: warn
    kind: mybatis
    globs: ['*.xml', '*.java']
    message: 'namespace 에 맞는 Java 클래스·인터페이스도, Java 의 "namespace.문장" 참조(DAO 꼴)도 없다'
    fix: 'namespace 를 Mapper 인터페이스 전체 이름이나 DAO 의 참조 앞부분에 맞춘다'
  - id: mybatis.parseError
    group: mybatis
    severity: info
    kind: mybatis
    globs: ['*.xml']
    message: XML 을 못 읽어 MyBatis 규칙을 건너뛰었다
