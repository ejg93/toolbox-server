# 코드 검사 내장 규칙(PLAN 3.1·3.5·5-1). 규칙 하나 = id·group·severity·globs + kind 별 값.
# kind: regex(기본 — regex·flags·skipComments, params.max 면 건수 규칙) · file(params.check) · jsUnusedImport
# 프로필 codecheck.customRules 가 같은 꼴로 더하고(같은 id 면 바꿈), codecheck.rules 가 id 별로 덮어쓴다.
# ㄱ(common)은 JSP·HTML·Java·설정 파일, ㅁ(tsx)은 JS·TS 파일 — 같은 잔재를 두 번 세지 않게 글롭을 나눈다.
# ㅇ(security)은 다른 묶음과 겹쳐도 따로 센다(보안약점 보고용 묶음).
rules:
  # ---------------------------------------------------------------- ㄱ 공통 잔재
  - id: common.debugger
    group: common
    severity: warn
    globs: ['*.jsp', '*.jspf', '*.html', '*.htm']
    regex: '\bdebugger\b'
    skipComments: true
    message: debugger 문 잔재
  - id: common.consoleLog
    group: common
    severity: warn
    globs: ['*.jsp', '*.jspf', '*.html', '*.htm']
    regex: '\bconsole\.log\s*\('
    skipComments: true
    message: console.log 잔재
  - id: common.alert
    group: common
    severity: info
    globs: ['*.jsp', '*.jspf', '*.html', '*.htm', '*.js', '*.jsx', '*.ts', '*.tsx']
    regex: '(?<![\w$.])alert\s*\('
    skipComments: true
    message: alert( 호출 — 디버그 잔재인지 확인
  - id: common.sysout
    group: common
    severity: warn
    globs: ['*.java', '*.jsp', '*.jspf']
    regex: '\bSystem\s*\.\s*(?:out|err)\s*\.\s*print'
    skipComments: true
    message: System.out/err 출력 — 로거로
  - id: common.printStackTrace
    group: common
    severity: warn
    globs: ['*.java', '*.jsp', '*.jspf']
    regex: '\.printStackTrace\s*\(\s*\)'
    skipComments: true
    message: printStackTrace — 로거로
  - id: common.todo
    group: common
    severity: info
    globs: ['*.java', '*.jsp', '*.jspf', '*.js', '*.jsx', '*.ts', '*.tsx', '*.xml', '*.sql', '*.properties']
    regex: '\b(?:TODO|FIXME|XXX)\b'
    skipComments: false
    message: TODO·FIXME 남음
  - id: common.localhost
    group: common
    severity: warn
    globs: ['*.java', '*.jsp', '*.jspf', '*.js', '*.jsx', '*.ts', '*.tsx', '*.xml', '*.properties', '*.yml', '*.yaml', '*.html']
    regex: '\blocalhost\b|(?<![\d.])127\.0\.0\.1(?![\d.])'
    skipComments: true
    message: localhost 주소 하드코딩
  - id: common.devIp
    group: common
    severity: warn
    globs: ['*.java', '*.jsp', '*.jspf', '*.js', '*.jsx', '*.ts', '*.tsx', '*.xml', '*.properties', '*.yml', '*.yaml', '*.html']
    regex: '(?<![\d.])(?:10(?:\.\d{1,3}){3}|192\.168(?:\.\d{1,3}){2}|172\.(?:1[6-9]|2\d|3[01])(?:\.\d{1,3}){2})(?![\d.])'
    skipComments: true
    message: 사설(개발) IP 하드코딩
  - id: common.password
    group: common
    severity: error
    globs: ['*.properties', '*.xml', '*.yml', '*.yaml', '*.jsp', '*.js']
    regex: '\b(?:password|passwd|pwd)\b["'']?\s*(?:[=:]|value\s*=)\s*["'']?[^\s"''$#{<>]'
    flags: [i]
    skipComments: true
    message: 비밀번호 값 하드코딩 — 외부 설정·암호화로

  # ---------------------------------------------------------------- ㄹ JSP
  - id: jsp.expression
    group: jsp
    severity: info
    globs: ['*.jsp', '*.jspf', '*.tag']
    regex: '<%='
    skipComments: true
    message: <%= %> 출력 — 이스케이프 없이 나간다(c:out·fn:escapeXml)
  - id: jsp.escapeXmlFalse
    group: jsp
    severity: warn
    globs: ['*.jsp', '*.jspf', '*.tag']
    regex: 'escapeXml\s*=\s*["'']false["'']'
    flags: [i]
    skipComments: true
    message: escapeXml="false" — 이스케이프를 끈다
  - id: jsp.scriptlets
    group: jsp
    severity: info
    globs: ['*.jsp', '*.jspf', '*.tag']
    regex: '<%(?![@=!-])'
    skipComments: true
    message: 스크립틀릿 블록 수가 기준을 넘는다
    params: {max: 0}

  # ---------------------------------------------------------------- ㅁ TSX·JS
  - id: tsx.debugger
    group: tsx
    severity: warn
    globs: ['*.js', '*.jsx', '*.ts', '*.tsx', '*.mjs']
    regex: '\bdebugger\b'
    skipComments: true
    message: debugger 문 잔재
  - id: tsx.console
    group: tsx
    severity: warn
    globs: ['*.js', '*.jsx', '*.ts', '*.tsx', '*.mjs']
    regex: '\bconsole\.(?:log|debug|info|warn|error|trace|dir|table)\s*\('
    skipComments: true
    message: console 호출 잔재
  - id: tsx.unusedImport
    group: tsx
    severity: warn
    kind: jsUnusedImport
    globs: ['*.js', '*.jsx', '*.ts', '*.tsx', '*.mjs']
    message: 쓰지 않는 import
  - id: tsx.any
    group: tsx
    severity: info
    globs: ['*.ts', '*.tsx']
    regex: ':\s*any\b|\bas\s+any\b|<any>'
    skipComments: true
    message: any 타입
  - id: tsx.eslintDisable
    group: tsx
    severity: info
    globs: ['*.js', '*.jsx', '*.ts', '*.tsx', '*.mjs']
    regex: 'eslint-disable'
    skipComments: false
    message: eslint-disable 주석

  # ---------------------------------------------------------------- ㅂ 파일
  - id: file.encoding
    group: file
    severity: warn
    kind: file
    globs: ['*.java', '*.jsp', '*.jspf', '*.tag', '*.js', '*.jsx', '*.ts', '*.tsx', '*.xml', '*.properties', '*.html', '*.css', '*.sql']
    message: 인코딩이 프로필 project.encoding 과 다르다
    params: {check: encoding}
  - id: file.lineEnding
    group: file
    severity: info
    kind: file
    globs: ['*.java', '*.jsp', '*.jspf', '*.tag', '*.js', '*.jsx', '*.ts', '*.tsx', '*.xml', '*.properties', '*.html', '*.css', '*.sql']
    message: 줄바꿈이 프로필 project.lineEnding 과 다르다
    params: {check: lineEnding}
  - id: file.mixedIndent
    group: file
    severity: info
    kind: file
    globs: ['*.java', '*.jsp', '*.jspf', '*.tag', '*.js', '*.jsx', '*.ts', '*.tsx', '*.xml', '*.html', '*.css', '*.sql']
    message: 탭 들여쓰기와 공백 들여쓰기가 한 파일에 섞였다
    params: {check: mixedIndent}
  - id: file.header
    group: file
    severity: info
    kind: file
    globs: ['*.java']
    message: 파일 헤더 개정이력(수정일 수정자 수정내용) 누락 — 프로필 naming.headerRequired
    params: {check: header}

  # ---------------------------------------------------------------- ㅇ 보안약점(정적분)
  - id: security.sqlDollar
    group: security
    severity: error
    globs: ['*.xml']
    regex: '\$\{'
    skipComments: true
    message: SQL 삽입 — MyBatis ${} 치환(#{} 로)
  - id: security.sqlConcat
    group: security
    severity: error
    globs: ['*.java', '*.jsp']
    regex: '"[^"]*\b(?:SELECT|INSERT|UPDATE|DELETE|MERGE)\b[^"]*"\s*\+\s*[\w(]'
    flags: [i]
    skipComments: true
    message: SQL 삽입 — 문자열 조립 쿼리(바인드 변수로)
  - id: security.xssExpression
    group: security
    severity: warn
    globs: ['*.jsp', '*.jspf', '*.tag']
    regex: '<%=\s*request\s*\.\s*getParameter|<%=(?![^%]*(?:escape|encode))'
    skipComments: true
    message: XSS — 이스케이프 없는 <%= 출력
  - id: security.xssEscapeXml
    group: security
    severity: warn
    globs: ['*.jsp', '*.jspf', '*.tag']
    regex: 'escapeXml\s*=\s*["'']false["'']'
    flags: [i]
    skipComments: true
    message: XSS — escapeXml="false"
  - id: security.pathTraversal
    group: security
    severity: error
    globs: ['*.java', '*.jsp']
    regex: 'new\s+(?:java\.io\.)?File(?:InputStream|OutputStream|Reader|Writer)?\s*\([^;]*getParameter\s*\('
    skipComments: true
    message: 경로 조작 — 요청 파라미터로 파일 경로를 만든다
  - id: security.hardcodedPassword
    group: security
    severity: error
    globs: ['*.java']
    regex: '\b\w*(?:password|passwd|pwd)\w*\s*=\s*"[^"]+"'
    flags: [i]
    skipComments: true
    message: 하드코딩 비밀번호
  - id: security.exceptionMessage
    group: security
    severity: warn
    globs: ['*.java', '*.jsp']
    regex: '(?:\baddAttribute|\baddObject|\bgetWriter\s*\(\s*\)|\bout\s*\.\s*print(?:ln)?|\bResponseEntity|\.body)\s*[.(<].*\.getMessage\s*\(\s*\)'
    skipComments: true
    message: 예외 메시지 노출 — getMessage() 를 응답에 싣는다

  # ---------------------------------------------------------------- ㅇ 2차 — KISA 구현단계 정적분(5-13, 2026-10-03)
  # 기준은 CWE Top 25 가 아니라 행안부·KISA 「소프트웨어 개발보안 가이드」 구현단계 항목(감리가 인용하는 번호).
  # 등급: 쓰는 순간 지적이면 error, 입력이 닿는지 봐야 하면 warn, 확인용이면 info
  - id: security.osCommand
    group: security
    severity: error
    globs: ['*.java', '*.jsp']
    regex: 'Runtime\s*\.\s*getRuntime\s*\(\s*\)\s*\.\s*exec\s*\(|new\s+ProcessBuilder\s*\('
    skipComments: true
    message: 운영체제 명령어 삽입 — 외부 입력이 닿는지 확인
  - id: security.deserialization
    group: security
    severity: error
    globs: ['*.java']
    regex: 'new\s+ObjectInputStream\s*\(|new\s+XMLDecoder\s*\(|\.(?:enableDefaultTyping|activateDefaultTyping)\s*\('
    skipComments: true
    message: 신뢰할 수 없는 데이터의 역직렬화
  - id: security.codeInjection
    group: security
    severity: warn
    globs: ['*.java']
    regex: 'ScriptEngineManager|\.eval\s*\(|parseExpression\s*\('
    skipComments: true
    message: 코드 삽입 — 외부 입력이 닿는지 확인
  - id: security.ssrf
    group: security
    severity: warn
    globs: ['*.java']
    regex: 'new\s+URL\s*\([^;]*getParameter|(?:RestTemplate|HttpClient|HttpURLConnection|openConnection)[^;]*getParameter'
    skipComments: true
    message: 서버사이드 요청 위조 — 요청 파라미터로 URL 을 만든다
  - id: security.openRedirect
    group: security
    severity: warn
    globs: ['*.java']
    regex: 'sendRedirect\s*\([^;]*getParameter|"redirect:"\s*\+'
    skipComments: true
    message: 신뢰되지 않는 URL 주소로 자동접속 연결 — 이동 주소를 허용목록으로
  - id: security.responseSplitting
    group: security
    severity: warn
    globs: ['*.java']
    regex: '(?:setHeader|addHeader|addCookie|new\s+Cookie)\s*\([^;]*getParameter'
    skipComments: true
    message: HTTP 응답분할 — 요청 파라미터를 헤더·쿠키에 넣는다
  - id: security.weakHash
    group: security
    severity: error
    globs: ['*.java', '*.jsp']
    regex: 'MessageDigest\s*\.\s*getInstance\s*\(\s*"(?:MD2|MD4|MD5|SHA-?1)"'
    flags: [i]
    skipComments: true
    message: 취약한 암호화 알고리즘 사용 — 해시는 SHA-256 이상
  - id: security.weakCipher
    group: security
    severity: error
    globs: ['*.java', '*.jsp']
    regex: 'Cipher\s*\.\s*getInstance\s*\(\s*"(?:DES|DESede|RC2|RC4|ARCFOUR|Blowfish)\b|Cipher\s*\.\s*getInstance\s*\(\s*"[^"]*/ECB/'
    flags: [i]
    skipComments: true
    message: 취약한 암호화 알고리즘 사용 — 암호는 AES/GCM·CBC
  - id: security.weakRandom
    group: security
    severity: info
    globs: ['*.java', '*.jsp']
    regex: 'new\s+(?:java\.util\.)?Random\s*\(|Math\s*\.\s*random\s*\('
    skipComments: true
    message: 적절하지 않은 난수 값 사용 — 보안 용도면 SecureRandom
  - id: security.hardcodedKey
    group: security
    severity: error
    globs: ['*.java']
    regex: '(?:SecretKeySpec|IvParameterSpec|PBEKeySpec)\s*\(\s*"'
    skipComments: true
    message: 하드코드된 암호화 키
  - id: security.jsEval
    group: security
    severity: warn
    globs: ['*.jsp', '*.jspf', '*.html', '*.htm', '*.js', '*.jsx', '*.ts', '*.tsx', '*.mjs']
    regex: '(?<![\w$.])eval\s*\(|new\s+Function\s*\(|set(?:Timeout|Interval)\s*\(\s*["'']'
    skipComments: true
    message: 코드 삽입 — eval·Function·문자열 타이머
  - id: security.domXss
    group: security
    severity: info
    globs: ['*.jsp', '*.jspf', '*.html', '*.htm', '*.js', '*.jsx', '*.ts', '*.tsx', '*.mjs']
    regex: '\.(?:innerHTML|outerHTML)\s*\+?=(?!=)(?!\s*["'']{2}\s*;)|document\s*\.\s*write(?:ln)?\s*\(|insertAdjacentHTML\s*\('
    skipComments: true
    message: 크로스사이트 스크립트(DOM) — 입력이 들어가면 textContent·이스케이프
  - id: security.jsxDangerousHtml
    group: security
    severity: warn
    globs: ['*.jsx', '*.tsx']
    regex: 'dangerouslySetInnerHTML'
    skipComments: true
    message: 크로스사이트 스크립트 — dangerouslySetInnerHTML
  - id: security.jspElParam
    group: security
    severity: warn
    globs: ['*.jsp', '*.jspf', '*.tag']
    regex: '(?<![="''(])\$\{param\.'
    skipComments: true
    message: 크로스사이트 스크립트 — 요청 파라미터 EL 직접 출력(<c:out> 으로)
  - id: security.fileUpload
    group: security
    severity: info
    globs: ['*.java']
    regex: 'getOriginalFilename\s*\('
    skipComments: true
    message: 위험한 형식 파일 업로드 — 확장자 허용목록·크기·저장 경로 확인

  # ---------------------------------------------------------------- ㄴ Java 구조(JavaParser, 5-2)
  # kind: java — 파일 하나를 한 번 파싱해 같이 돈다. 명명 정규식은 프로필 naming. egovOnly 는 framework egov* 일 때만
  - id: java.unusedImport
    group: java
    severity: warn
    kind: java
    globs: ['*.java']
    message: 쓰지 않는 import
  - id: java.starImport
    group: java
    severity: info
    kind: java
    globs: ['*.java']
    message: '* import'
  - id: java.naming
    group: java
    severity: warn
    kind: java
    globs: ['*.java']
    message: '@Controller·@Service·@Repository 클래스 이름이 프로필 naming 정규식과 다르다'
  - id: java.serviceImplPair
    group: java
    severity: warn
    kind: java
    globs: ['*.java']
    message: XxxServiceImpl 이 XxxService 를 implements 하지 않는다
  - id: java.serviceName
    group: java
    severity: warn
    kind: java
    globs: ['*.java']
    message: '@Service("이름") 이 클래스·인터페이스 이름(첫 글자 소문자)과 다르다'
    params: {egovOnly: true}
  - id: java.egovBase
    group: java
    severity: warn
    kind: java
    globs: ['*.java']
    message: ServiceImpl 이 naming.serviceImplBase(EgovAbstractServiceImpl)를 상속하지 않는다
    params: {egovOnly: true}
  - id: java.emptyCatch
    group: java
    severity: warn
    kind: java
    globs: ['*.java']
    message: 빈 catch(주석만 있는 것 포함)
  - id: java.swallow
    group: java
    severity: warn
    kind: java
    globs: ['*.java']
    message: ServiceImpl 안 catch 가 예외를 삼킨다(throw·로거·processException 없음)
  - id: java.controllerDao
    group: java
    severity: warn
    kind: java
    globs: ['*.java']
    message: Controller 가 DAO 를 직접 든다
  - id: java.dupMapping
    group: java
    severity: error
    kind: java
    globs: ['*.java']
    message: 같은 HTTP 방식·URL 매핑이 둘 이상(프로젝트 전체)
  - id: java.parseError
    group: java
    severity: info
    kind: java
    globs: ['*.java']
    message: Java 구문을 못 읽어 구조 규칙을 건너뛰었다

  # ---------------------------------------------------------------- ㄷ MyBatis XML(JDK SAX, 5-3)
  # kind: mybatis — <mapper> XML 의 문장 요소 글에서 SQL 주석을 뗀 뒤. namespace 는 같은 검사에서 본 Java 소스와 견준다
  - id: mybatis.dollar
    group: mybatis
    severity: warn
    kind: mybatis
    globs: ['*.xml']
    message: '${} 치환 — #{} 바인드로(정렬 컬럼 등 불가피하면 화이트리스트)'
  - id: mybatis.selectStar
    group: mybatis
    severity: info
    kind: mybatis
    globs: ['*.xml']
    message: 'SELECT * — 컬럼을 적는다(페이징 래퍼 SELECT * FROM ( 는 뺌)'
  - id: mybatis.dupId
    group: mybatis
    severity: error
    kind: mybatis
    globs: ['*.xml']
    message: 같은 파일 안 문장 id 중복
  - id: mybatis.namespace
    group: mybatis
    severity: warn
    kind: mybatis
    globs: ['*.xml', '*.java']
    message: 'namespace 에 맞는 Java 클래스·인터페이스도, Java 의 "namespace.문장" 참조(DAO 꼴)도 없다'
  - id: mybatis.parseError
    group: mybatis
    severity: info
    kind: mybatis
    globs: ['*.xml']
    message: XML 을 못 읽어 MyBatis 규칙을 건너뛰었다
