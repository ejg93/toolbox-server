<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코드 검사</title>
<link rel="stylesheet" href="/tools/common.css">
<style>
/* 공용(토큰·본문·머리줄·입력칸·버튼·탭·우물·고르는 표·메시지)은 /tools/common.css. 여기는 이 화면에만 있는 것 */
body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
.dirbar { gap: 10px; }
.dirbar input[type=text] { width: 420px; }
.top { display: flex; gap: 12px; padding: 12px 14px 0; height: 38%; min-height: 180px; }
.col { flex: 1; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
.label { font-size: 10px; color: var(--muted); letter-spacing: 2px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
textarea { flex: 1; padding: 10px; resize: none; white-space: pre; }
#rules { flex: 1; overflow: auto; padding: 8px 10px; }
#rules .grp { margin-bottom: 6px; }
#rules .ghead { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text); }
#rules .ghead .n { color: var(--muted); font-size: 10px; }
#rules .rlist { display: none; padding: 4px 0 2px 22px; }
#rules .grp.open .rlist { display: block; }
#rules .rule { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
#rules .rule .id { min-width: 190px; }
#rules .rule .sev { width: 40px; color: var(--muted); font-size: 10px; }
#rules .rule input[type=text] { flex: 1; font-size: 11px; padding: 2px 4px; }
#rules .rule .msg { color: var(--muted); font-size: 10px; min-height: 0; margin: 0; white-space: normal; }
.bottom { flex: 1; display: flex; flex-direction: column; gap: 6px; padding: 10px 14px 12px; overflow: hidden; }
.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.split { flex: 1; display: flex; gap: 12px; overflow: hidden; }
#result { flex: 3; overflow: auto; border: 1px solid var(--border); border-radius: 4px; }
#preview { flex: 2; overflow: auto; padding: 8px 10px; white-space: pre; font-size: 12px; line-height: 1.5; color: var(--code); }
#count { color: var(--muted); }
.tabbar { display: flex; gap: 3px; padding: 8px 16px 0; }
.pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#paneDeploy { display: none; padding: 10px 14px 12px; gap: 6px; }
#depResult { flex: 1; overflow: auto; border: 1px solid var(--border); border-radius: 4px; }
#depCount, #depNote { color: var(--muted); }
</style>
<script src="/tools/common.js" defer></script>
<script src="/tools/code_check_ext.js" defer></script>
</head>
<body>
<header>
	<h1>코드 검사</h1>
	<span class="opt">규칙 묶음을 고르고 폴더 또는 붙여넣은 글을 훑어 파일·줄 목록을 낸다. 이력은 파일·줄·규칙까지만 남는다</span>
</header>
<div class="dirbar">
	<span class="opt">폴더</span>
	<input type="text" id="dir" list="dirRecent" spellcheck="false" placeholder="C:\project\src — 켜진 규칙의 파일 전부">
	<datalist id="dirRecent"></datalist>
	<label class="opt" id="changedLabel" title="git·svn 작업 사본이면 켜진다"><input type="checkbox" id="changed" disabled> 변경분만</label>
	<span class="opt" id="vcsInfo"></span>
	<button class="btn-p" id="runDir">폴더 검사</button>
	<button class="btn-red" id="runStop" disabled>중지</button>
	<span id="msg"></span>
</div>
<div class="tabbar"><span class="t on" id="tabCheck">검사</span><span class="t" id="tabDeploy">배포 목록</span></div>
<div class="pane" id="paneCheck">
<div class="top">
	<div class="col">
		<div class="label"><span>붙여넣기</span>
			<span class="opt">언어 <select id="lang">
				<option value="">자동</option><option value="java">Java</option><option value="jsp">JSP</option>
				<option value="xml">MyBatis XML</option><option value="js">JS</option><option value="ts">TS</option>
			</select> <button class="btn-p" id="runText">붙여넣기 검사</button></span></div>
		<textarea id="paste" spellcheck="false" placeholder="소스를 붙여 넣는다 — 파일 묶음(인코딩·줄바꿈)은 폴더 검사에서만"></textarea>
	</div>
	<div class="col">
		<div class="label"><span>규칙 — 묶음을 누르면 펼친다(개별 켬·정규식)</span>
			<span><button id="saveRules">프로필에 저장</button> <span id="ruleMsg"></span></span></div>
		<div id="rules" class="well"></div>
	</div>
</div>
<div class="bottom">
	<div class="bar">
		<span class="opt">등급 <select id="fSev"><option value="">전체</option><option value="error">error</option><option value="warn">warn</option><option value="info">info</option></select></span>
		<span class="opt">묶음 <select id="fGroup"><option value="">전체</option></select></span>
		<span class="opt">찾기 <input type="text" id="fText" spellcheck="false" placeholder="파일·규칙"></span>
		<button class="btn-green" id="copy" disabled>복사</button>
		<button class="dl" id="xlsx" disabled><span class="ico ico-xlsx" aria-hidden="true"></span>xlsx</button>
		<button id="cmp" disabled>앞 실행과 비교</button>
		<span id="count"></span>
	</div>
	<div class="split">
		<div id="result" class="pick"></div>
		<div id="preview" class="well">행을 누르면 그 줄 앞뒤 5줄</div>
	</div>
</div>
</div>
<div class="pane" id="paneDeploy">
	<div class="bar">
		<span class="opt">부터 <input type="text" id="depFrom" list="depRecent" spellcheck="false" placeholder="커밋·태그 (예: v1.0)"></span>
		<span class="opt">까지 <input type="text" id="depTo" list="depRecent" spellcheck="false" value="HEAD"></span>
		<datalist id="depRecent"></datalist>
		<button class="btn-p" id="depRun">조회</button>
		<button class="dl" id="depXlsx"><span class="ico ico-xlsx" aria-hidden="true"></span>xlsx</button>
		<span id="depCount"></span>
		<span id="depMsg"></span>
	</div>
	<div class="opt" id="depNote">폴더 칸의 작업 사본에서 두 지점 사이에 바뀐 파일(추가·수정·삭제)을 배포 요청 목록으로 낸다</div>
	<div id="depResult"></div>
</div>
</body>
</html>
