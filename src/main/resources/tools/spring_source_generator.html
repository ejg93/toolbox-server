<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table → Spring 소스 생성</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
:root { --bg:#1e1e1e; --surface:#252526; --border:#3c3c3c; --text:#d4d4d4; --muted:#858585; --accent:#0078d4; --green:#16825d; --red:#f44747; --yel:#d7ba7d; }
body { font-family:'Consolas','D2Coding',monospace; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; font-size:12px; }
header { background:var(--surface); border-bottom:1px solid var(--border); padding:10px 16px; display:flex; align-items:center; gap:14px; flex-shrink:0; flex-wrap:wrap; }
header h1 { font-size:13px; color:#ccc; letter-spacing:2px; }
.opt { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); }
select, input[type=text] { background:#3c3c3c; border:1px solid #555; border-radius:3px; color:var(--text); font-family:'Consolas','D2Coding',monospace; font-size:12px; padding:4px 6px; outline:none; }
input[type=checkbox] { accent-color:var(--accent); }
button { font-family:'Consolas',monospace; font-size:12px; border:none; border-radius:4px; cursor:pointer; padding:6px 14px; letter-spacing:1px; }
button:hover { opacity:.85; }
button:disabled { opacity:.35; cursor:default; }
.btn-p { background:var(--accent); color:#fff; font-weight:bold; }
.bar { display:flex; align-items:center; gap:10px; padding:8px 16px; background:var(--surface); border-bottom:1px solid var(--border); flex-wrap:wrap; }
#pkg, #module { width:160px; }
#out { width:360px; }
#msg.err { color:var(--red); }
#msg.ok { color:var(--green); }
.main { flex:1; display:flex; gap:12px; padding:10px 14px 12px; overflow:hidden; }
.col { display:flex; flex-direction:column; gap:6px; overflow:hidden; }
.left { flex:2; }
.right { flex:3; }
.box { flex:1; overflow:auto; border:1px solid var(--border); border-radius:4px; }
#tables table { border-collapse:collapse; width:100%; }
#tables th, #tables td { border-bottom:1px solid var(--border); padding:3px 6px; text-align:left; white-space:nowrap; }
#tables thead th { position:sticky; top:0; background:var(--surface); color:#ccc; font-weight:normal; }
#tables tr.view td { color:var(--muted); }
#files tbody tr { cursor:pointer; }
#files tbody tr:hover { background:#2a2d2e; }
#files tbody tr.sel { background:#04395e; }
#preview { flex:1; overflow:auto; background:#111; border:1px solid var(--border); border-radius:4px; padding:8px 10px; white-space:pre; line-height:1.5; color:#9cdcfe; }
#warn { color:var(--yel); white-space:pre-wrap; max-height:80px; overflow:auto; }
.count { color:var(--muted); }
</style>
<script src="/tools/common.js" defer></script>
<script src="/tools/spring_source_generator_ext.js" defer></script>
</head>
<body>
<header>
	<h1>Table → Spring 소스 생성</h1>
	<span class="opt">스냅샷의 테이블을 골라 Controller·Service·DAO·VO·Mapper XML·JSP 세트를 템플릿으로 생성한다. 있는 파일은 안 덮는다 — 옆에 .gen 으로 쓴다</span>
</header>
<div class="bar">
	<span class="opt">스냅샷 <select id="snap"><option value="">—</option></select></span>
	<span class="opt">세트 <select id="set"></select></span>
	<span class="opt">패키지 <input type="text" id="pkg" spellcheck="false" placeholder="kr.go.xxx" title="기본 패키지"></span>
	<span class="opt">모듈 <input type="text" id="module" spellcheck="false" placeholder="비우면 표 이름" title="모듈(패키지 뒤)"></span>
	<span class="opt">출력 <input type="text" id="out" spellcheck="false" placeholder="C:\proj\gen" title="출력 폴더"></span>
	<button class="btn-p" id="run">생성</button>
	<span id="msg"></span>
</div>
<div class="main">
	<div class="col left">
		<div class="opt"><input type="text" id="fT" spellcheck="false" placeholder="표 이름·코멘트" title="표 찾기"> <span class="count" id="tCount"></span></div>
		<div class="box" id="tables"></div>
	</div>
	<div class="col right">
		<div class="box" id="files"></div>
		<div id="warn"></div>
		<div id="preview">행을 누르면 생성된 파일 내용</div>
	</div>
</div>
</body>
</html>
