# 7-8 개인정보 마스킹 SQL — 탐지 규칙. 위에서부터 첫 일치 종류 하나(이메일주소는 email 이 address 보다 먼저).
# keywords: 논리명 또는 컬럼 코멘트에 들어 있으면(앞이 이긴다). columns: 컬럼 이름(대문자) 정규식 — 밑줄 마디 경계로 묶는다.
# exclude: 논리명·코멘트가 이것으로 끝나면 이 종류가 아니다. notContaining: 이 글이 들어 있으면 아니다. excludeColumns: 컬럼 이름이 이 정규식에 걸리면 아니다.
# keep: 앞 head 글자·뒤 tail 글자만 남기고 가운데를 * 로. 길이가 head+tail 이하면 전부 *.
# 정규식은 중첩 반복을 쓰지 않는다(ReDoS).
kinds:
  - id: rrn
    label: 주민·외국인등록번호
    keywords: [주민등록번호, 주민번호, 외국인등록번호]
    columns: '(?:^|_)(?:IHIDNUM|JUMIN|JUMIN_?NO|RRN|RESIDENT_?NO|FRGNR_?NO)(?:_|$)'
    keep: { head: 6, tail: 0 }
  - id: phone
    label: 전화번호
    keywords: [전화번호, 휴대폰, 휴대전화, 이동전화, 핸드폰, 팩스번호, 연락처]
    columns: '(?:^|_)(?:[A-Z]*TELNO|MBTLNUM|FXNUM|PHONE[A-Z]*|MOBILE[A-Z]*|FAX[A-Z]*|HP_?NO|CELL_?NO)(?:_|$)'
    keep: { head: 0, tail: 4 }
  - id: email
    label: 이메일
    keywords: [이메일, 전자우편, 메일주소]
    columns: '(?:^|_)(?:EMAIL[A-Z]*|E_MAIL|MAIL_?ADRES|MAIL_?ADDR)(?:_|$)'
    keep: { head: 2, tail: 0 }
  - id: name
    label: 이름
    keywords: [성명, 이름, 사용자명, 회원명, 직원명, 사원명, 고객명, 신청자명, 작성자명, 등록자명, 담당자명, 수신자명, 발신자명, 대표자명]
    columns: '^(?:USER|MBER|MEMBER|EMPLYR|EMP|CUST|CUSTOMER|FIRST|LAST|FULL|APPLCNT|WRTER|RGSTR)_?(?:NM|NAME)$'
    exclude: [부서명, 기관명, 조직명, 파일명, 파일이름, 코드명, 업체명, 회사명, 프로그램명, 메뉴명, 시스템명, 테이블명, 컬럼명, 서버명, 게시판명, 그룹명, 권한명, 사업명, 상품명, 단체명, 직위명, 직급명, 화면명, 필드명, 속성명]
    keep: { head: 1, tail: 0 }
  - id: address
    label: 주소
    keywords: [주소]
    columns: '(?:^|_)(?:[A-Z]*ADRES|[A-Z]*ADDR|ADDRESS)(?:_|$)'
    notContaining: [주소록]          # 주소록 ID·주소록명은 주소가 아니다(eGov COMTNADBK, V-19)
    exclude: [IP주소, 아이피주소, URL주소, 웹주소, 홈페이지주소, MAC주소, 접속주소, 서버주소]
    excludeColumns: '(?:^|_)(?:IP|MAC|URL|WEB|SERVER|SVR|CONECT)_?(?:ADRES|ADDR)(?:_|$)'
    keep: { head: 6, tail: 0 }
  - id: account
    label: 계좌번호
    keywords: [계좌번호, 계좌]
    columns: '(?:^|_)(?:ACNUTNO|ACCOUNT_?NO|ACNT_?NO|BANKBOOK_?NO|BACNT_?NO)(?:_|$)'
    keep: { head: 0, tail: 4 }
  - id: card
    label: 카드번호
    keywords: [카드번호]
    columns: '(?:^|_)(?:CARD_?NO|CRDT_?CARD_?NO)(?:_|$)'
    keep: { head: 6, tail: 4 }
  - id: birth
    label: 생년월일
    keywords: [생년월일]
    columns: '(?:^|_)(?:BRTHDY|BIRTH|BIRTHDAY|BIRTH_?DE|BRTH_?DE)(?:_|$)'
    keep: { head: 4, tail: 0 }
