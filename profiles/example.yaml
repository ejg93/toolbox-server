# =====================================================================
# 사업 프로필 예시 — 사업 하나당 파일 하나
# ---------------------------------------------------------------------
# 쓰는 법
#   1. 이 파일을 profiles/<사업이름>.yaml 로 복사한다(예: profiles/우리사업.yaml)
#      실제 사업 프로필은 .gitignore 라 커밋되지 않는다. example.yaml 만 저장소에 있다
#   2. name 을 파일 이름과 같게 고치고 connections 에 접속 정보를 채운다
#   3. 기동: run.bat --profile 우리사업 --port 8080
#      (PowerShell 에서 JDK 17 이 안 잡히면 $env:JAVA_HOME='C:\Program Files\Java\jdk-17.0.19' 먼저)
#   4. 화면 db_browser → 비밀번호 넣기 → 접속 시험 → 스냅샷 찍기
#
# 주의
#   - 비밀번호는 여기 쓰지 않는다. url 에 password= 따위를 넣으면 기동 때 거절한다
#     비밀번호는 기동 뒤 화면에서 넣고 메모리에만 둔다(서버를 끄면 사라진다)
#   - 화면에서 프로필을 저장(PUT /api/profiles)하면 서버가 이 파일을 다시 쓴다 — 그때 주석은 사라진다
#     주석을 남기려면 손으로만 고친다
#   - 경로의 역슬래시는 / 로 쓴다(C:/proj/src). YAML 에서 \ 는 이스케이프로 읽힐 수 있다
# =====================================================================

# 프로필 이름. 파일 이름(확장자 뺀 것)과 같게. 화면 오른쪽 위 배지·출력 폴더 이름에 쓰인다
name: example

# ---------------------------------------------------------------------
# 소스 프로젝트 — 폴더를 읽는 도구들의 기본값
# ---------------------------------------------------------------------
project:
  # 소스 루트. 주석 삭제·jsp 폴더 일괄·폴더 비교·(M5)코드 검사 화면의 경로 칸 기본값
  # 절대 경로만. UNC(\\서버\공유)·Windows·Program Files 폴더는 서버가 거절한다
  root: C:/proj/src
  # 사업 소스의 기준 인코딩 — UTF-8 | MS949. (M5)코드 검사가 이와 다른 파일을 잡는다
  # 파일을 되쓸 때는 이 값이 아니라 그 파일을 읽은 인코딩 그대로 쓴다
  encoding: UTF-8
  # 기준 줄바꿈 — CRLF | LF. (M5)코드 검사가 다른 파일을 잡는다
  lineEnding: CRLF
  # 형상 관리 — svn | git | none. 기록용 값이다 — 코드 검사 「변경분만」 은 폴더의 .git·.svn 으로 판별하고 이 값은 안 읽는다
  vcs: svn

# ---------------------------------------------------------------------
# DB 접속 — 여러 개 둘 수 있다(개발·검증·운영)
# ---------------------------------------------------------------------
# JDBC 드라이버 jar 는 jar 옆 drivers/ 폴더에 넣는다(ojdbc·tibero·mariadb·mssql-jdbc 등)
# 현장 WAS lib 의 드라이버를 그대로 복사해 와도 된다. 기동 때 폴더를 훑어 등록한다
connections:
  - id: dev                                # 화면 select 에 보이는 이름. 영문·숫자로
    dialect: oracle                        # oracle | tibero | postgresql | mariadb | mssql
    url: jdbc:oracle:thin:@host:1521/SID   # 비밀번호 넣지 말 것. 예)
                                           #   Oracle     jdbc:oracle:thin:@10.0.0.1:1521/ORCL  (서비스명은 /, SID 는 :SID)
                                           #   Tibero     jdbc:tibero:thin:@10.0.0.1:8629:tibero
                                           #   PostgreSQL jdbc:postgresql://10.0.0.1:5432/mydb
                                           #   MariaDB    jdbc:mariadb://10.0.0.1:3306/mydb
                                           #   MSSQL      jdbc:sqlserver://10.0.0.1:1433;databaseName=mydb;encrypt=false
    user: APP                              # 접속 계정. 권한이 넓으면 남의 스키마까지 보이니 아래 scope.schemas 를 적는다
  # 두 번째 접속 예(운영 비교용). 쓰려면 주석을 푼다
  # - id: prod
  #   dialect: oracle
  #   url: jdbc:oracle:thin:@prod-host:1521/PROD
  #   user: APP_RO

# 화면이 처음 고르는 접속 id
defaultConnection: dev

# ---------------------------------------------------------------------
# 스냅샷 수집 범위 — 「스냅샷 찍기」 가 DB 에서 무엇을 읽나
# ---------------------------------------------------------------------
# 지금 코드는 아래 규칙을 「찍을 때」 적용한다 — 제외된 표는 스냅샷·산출물·논리명 어디에도 안 나온다
# 스키마 전체를 찍고 싶으면 exclude·include 를 비우고 skipEmpty 를 false 로 둔다
# (2026-09-27 메모: 스냅샷은 전체, 산출물 대상 표는 산출물 화면에서 고정 목록으로 — 아직 설계 전)
scope:
  # 읽을 스키마(Oracle·Tibero 는 소유자, PG 는 스키마, MariaDB 는 DB 이름, MSSQL 은 dbo 따위)
  # 비워 두면([]) 계정이 볼 수 있는 스키마 전부 — 시스템 스키마(SYS·SYSTEM·information_schema·pg_catalog 등)는 뺀다
  schemas: [APP, CMM]
  exclude:
    # 이 접두어로 시작하는 표를 뺀다(대소문자 무시)
    prefixes: [TMP_, BAK_]
    # 이 접미어로 끝나는 표를 뺀다
    suffixes: [_BAK, _TMP, _OLD]
    # 정규식에 맞는 표를 뺀다. 아래는 이름 끝이 날짜 8자리인 백업 표(TB_CUST_20240101)
    regex: ['_\d{8}$']
    # 이름을 콕 집어 뺀다. 예) [TB_TEST, TB_SAMPLE]
    tables: []
  include:
    # 채우면 이 표들만 찍는다(제외 규칙보다 먼저). 비어 있으면 위 제외 규칙만 적용
    tables: []
  # true 면 행 수가 0 인 표를 뺀다. 행 수는 DB 통계값이라 통계가 오래됐으면 틀릴 수 있다
  skipEmpty: false

# ---------------------------------------------------------------------
# 산출물(deliverable_sql 화면) — 정의서·표준 xlsx 01~11 기입
# ---------------------------------------------------------------------
deliverable:
  author: 홍길동       # 작성자(최종수정자) 칸 기본값. 화면에서 덮어쓸 수 있다
  org: 기관명          # 기관명 칸 기본값
  # 발주처 양식 xlsx 가 든 폴더. 실제 양식은 저장소에 넣지 않는다 — templates/deliverable/<사업>/ 에 두고 여기를 고친다
  templateDir: templates/deliverable/example/
  # 양식의 어느 셀에 무엇을 쓸지 적은 매핑 YAML. 양식이 바뀌면 이 파일만 고친다
  mapping: mappings/deliverable/example.yaml

# ---------------------------------------------------------------------
# 명명 규칙 — (M5)코드 검사 Java 묶음이 본다. 아직 코드 검사는 없다(번들 11)
# ---------------------------------------------------------------------
naming:
  controller: '^[A-Z]\w*Controller$'     # @Controller 클래스 이름 정규식
  service: '^[A-Z]\w*Service$'           # 서비스 인터페이스
  serviceImpl: '^[A-Z]\w*ServiceImpl$'   # 서비스 구현
  dao: '^[A-Z]\w*(DAO|Mapper)$'          # DAO·Mapper — Controller 가 이 타입을 바로 부르면 잡는다
  serviceImplBase: egovframework.rte.fdl.cmmn.EgovAbstractServiceImpl   # eGov 구현 클래스가 상속해야 하는 부모
  headerRequired: true                   # true 면 Java 파일 머리에 개정이력 표(수정일 수정자 수정내용)가 없을 때 잡는다

# ---------------------------------------------------------------------
# 코드 검사 — (M5) 규칙 묶음·규칙 덮어쓰기. 화면에서 고른 상태를 「프로필에 저장」 하면 groups·rules 두 줄이 바뀐다
# ---------------------------------------------------------------------
codecheck:
  # 규칙 묶음 켜고 끄기. common=ㄱ 공통 잔재, java=ㄴ Java 구조, mybatis=ㄷ XML, jsp=ㄹ, tsx=ㅁ TSX·JS, file=ㅂ 인코딩·개행, security=ㅇ 보안약점, pmd=ㅅ(미탑재). 없는 묶음은 켠다
  groups: { common: true, java: true, mybatis: true, jsp: false, tsx: false, file: true, security: true, pmd: false }
  # 규칙 하나씩 덮어쓰기. 예) { common.sysout: false, common.todo: { severity: info } }
  rules: {}
  # 사업별로 더 넣을 정규식 규칙 파일(없으면 무시)
  customRules: rules/example.yaml

# 프레임워크 세대 — egov35 | egov4 | spring
# eGov 전용 검사 규칙(상속·@Service 이름)과 (M7)CRUD 생성기 템플릿만 이 값을 본다. 모르면 spring(eGov 규칙 꺼짐)
framework: egov35

# ---------------------------------------------------------------------
# 출력 폴더 — xlsx·백업·생성 파일이 떨어지는 곳
# ---------------------------------------------------------------------
output:
  # jar 기준 상대 경로. 실제로는 out/<프로필>/<날짜시각>/ 아래에 쌓인다
  # 폴더 일괄(주석 삭제·jsp 정리)의 원본 백업도 여기 backup/ 에 남는다
  dir: out/

# ---------------------------------------------------------------------
# CRUD 생성기 — (M7) 아직 없음. 값만 미리 둔다
# ---------------------------------------------------------------------
generator:
  templateSet: egov35        # 템플릿 세트 폴더 이름
  basePackage: kr.go.xxx     # 생성 소스의 기본 패키지
  outDir: C:/proj/gen        # 생성 파일을 쓸 폴더

# ---------------------------------------------------------------------
# 논리명(logical_name 화면)·DTO 생성
# ---------------------------------------------------------------------
logicalName:
  # 표 이름 앞에서 떼는 토큰. TB_CUST_MST → CUST_MST 로 보고 논리명·DTO 클래스명(CustMst)을 만든다
  skipTokens: [TB, TBL]
