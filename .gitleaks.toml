# gitleaks 설정(0-18 secrets 잡) — 기본 규칙을 그대로 쓰고 예외는 아래 하나뿐이다.
# 예외를 더할 때는 그 문자열이 비밀이 아니라는 근거를 한 줄 적는다.
[extend]
useDefault = true

[allowlist]
description = "jwt.io 공개 예시 토큰 — dev_tools JWT 디코더 칸의 placeholder(header HS256, payload sub 1234567890). 순수본 복사라 pure/ 에도 있다"
regexes = ['''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c''']
